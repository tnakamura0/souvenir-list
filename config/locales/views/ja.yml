          placeholder: 例：東京ばな奈
          submit: 保存
          display: お土産
      progress:
        title: 購入進捗
        completed: 全員分購入完了！
        purchased: "%{purchased_count} / %{total_count} 件購入済み"
    edit:
      title: 旅行を編集
      description: 旅行の情報を編集できます。
    form:
      name:
        placeholder: 例：札幌出張、大阪家族旅行
      destination:
        placeholder: 例：北海道、大阪
    recipient_list:
      title: お土産を渡す相手
      add: 追加
      empty:
        message: お土産を渡す相手がまだ追加されていません。
        action: 相手を追加する
  recipients:
