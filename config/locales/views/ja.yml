  sessions:
    new:
      hero:
        title:
          primary: お土産の買い忘れをなくして、
          accent: 旅行をもっと楽しもう。
        description: 家族や友人、職場など、お土産を渡したい相手を旅行前にリストアップ。旅行中は買った相手をチェックするだけの、シンプルなお土産管理アプリです。
        agreement_html: "ログインすると、%{terms}および%{privacy_policy}に同意したものとみなします。"
