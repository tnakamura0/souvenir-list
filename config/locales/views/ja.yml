      title: 相手情報を編集
      description: 相手の情報を編集できます。
    form:
      name:
        placeholder: 例：父親、営業部 A 部長、山田さん
      people_count:
        placeholder: 例：10
      memo:
        placeholder: 例：お酒好き、甘いものは苦手
      tags:
        empty: 登録されているタグはありません
