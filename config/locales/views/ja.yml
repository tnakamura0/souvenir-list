      title: 旅行に相手を追加
      description: "%{trip_name}でお土産を渡す相手を選んでください。"
      tag_filter:
        all: すべて表示
        submit: 絞り込む
      recipient_count: "%{count}件表示中"
      select_all: "表示中の%{count}件をすべて選択"
      submit: 選択した相手を追加
      empty:
        message: 追加できる相手がいません。
        action: 相手を登録する
      selected_count: 件選択中
      submit: 旅行へ追加
  tags:
    index:
      title: タグ一覧
      description: タグを作成すると、相手を分類して探しやすくできます。
      empty:
        message: タグがまだ作成されていません。
    edit:
      title: タグ編集
      description: タグの名前を変更できます。
    form:
      name:
        placeholder: 例：友人、親戚
    tag:
      delete_confirmation: "%{tag_name}タグを削除しますか？"
  today:
