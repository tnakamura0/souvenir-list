        title: タグで絞り込む
        all: すべてのタグ
        submit: 絞り込む
      empty:
        title: 相手がまだ登録されていません
        description: 家族・同僚・友人などを登録しましょう。
        action: 最初の相手を登録する
    new:
      title: 新しい相手を作成
      description: お土産を渡したい相手の情報を入力してください。
    show:
      title: 相手詳細
      description: 相手の情報とお土産履歴を確認できます。
      souvenir_list:
        title: お土産履歴
        souvenir: お土産
